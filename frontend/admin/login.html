<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin & Staff Login | Public Transport Information Platform</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body style="background-color: #0f172a;">

  <div class="auth-wrapper">
    <div class="card p-4 p-md-5 border-0 shadow-xl" style="max-width: 460px; width: 100%; border-radius: var(--radius-lg);">
      <div class="text-center mb-4">
        <div class="feature-icon-wrapper icon-rose mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.6rem;">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h3 class="fw-bold mb-1">Administrative Access</h3>
        <p class="text-muted small">Transport Operations & Administration Portal</p>
      </div>

      <div id="admin-error-alert" class="alert alert-danger d-none py-2 px-3 small mb-3"></div>

      <form id="admin-login-form">
        <div class="mb-3">
          <label class="form-label small fw-bold text-muted text-uppercase">Admin / Operator Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fa-solid fa-user-shield text-muted"></i></span>
            <input type="text" class="form-control" id="admin_username" placeholder="e.g. admin or operator" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold text-muted text-uppercase">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
            <input type="password" class="form-control" id="admin_password" placeholder="Enter secure admin password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-danger w-100 py-2 fs-6 fw-bold mb-3">
          <i class="fa-solid fa-right-to-bracket me-2"></i> Authenticate & Enter Portal
        </button>
      </form>

      <div class="bg-light p-3 rounded small text-muted mb-3 border">
        <strong>Default Demo Accounts:</strong><br>
        • Admin: <code>admin</code> / <code>admin123</code><br>
        • Operator: <code>operator</code> / <code>operator123</code>
      </div>

      <div class="text-center">
        <a href="/index.html" class="small text-muted text-decoration-none">&larr; Return to Public Website</a>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- API Client JS -->
  <script src="/js/api.js"></script>
  <!-- Auth JS -->
  <script src="/js/auth.js"></script>
</body>
</html>
